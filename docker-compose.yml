services:
  postgres:
    image: postgres:17-alpine
    container_name: bizintel-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bizintel_pgdata:/var/lib/postgresql/data
      # Schema di-init otomatis saat pertama kali container dibuat
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bizintel-backend
    restart: unless-stopped
    # Kredensial hanya di sini (runtime env, TIDAK dibake ke image).
    # Nilai interpolasi dibaca dari .env / environment shell.
    environment:
      # Bridge ke semantis app/db.py: env PG* > file .env POSTGRES_*
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER di .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB di .env}
      # LLM (opsional; tanpa kredensial -> /api/chat 503 llm_not_configured,
      # dashboard analytics tetap jalan penuh)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # CORS default mengikuti mapping frontend standar (:3000); bila
      # FRONTEND_PORT di-override, set BIZINTEL_CORS_ORIGINS juga.
      BIZINTEL_CORS_ORIGINS: ${BIZINTEL_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Dilihat browser host -> arahkan ke port mapping backend (8020)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8020}
    container_name: bizintel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bizintel_pgdata:
