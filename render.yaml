# Render Blueprint — BizIntel AI backend (free plan, Docker).
# Deploy: Render Dashboard -> New -> Blueprint -> pilih repo root.
# dockerfilePath relatif ke root repo; build context default = root repo
# (backend/Dockerfile memang COPY backend/, data/, scripts/, db/ dari root).
# Semua kredensial memakai sync: false — nilainya diisi di dashboard saat
# deploy dan TIDAK PERNAH disimpan di repo.
services:
  - type: web
    name: bizintel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # PostgreSQL (Supabase session pooler) — lihat docs/cloud-deployment.md
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGSSLMODE
        value: require
      # CORS origin frontend produksi (https://<nama>.vercel.app)
      - key: BIZINTEL_CORS_ORIGINS
        sync: false
      # LLM agent (opsional; tanpa ini /api/chat 503 llm_not_configured,
      # dashboard analytics tetap jalan penuh)
      - key: ANTHROPIC_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
